<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D服中文资料站</title>
    <link rel="stylesheet" href="droptable-info.css">
    <link rel="stylesheet" href="bazaar-info.css">
</head>

<body>

    <div class="header">梦幻之星 命运服 中文资料站</div>

    <div class="top-info-row">
        <div class="top-info-col left-col">
            <div class="info-title"> </div>


            <div class="info-text">
                <a href="https://qm.qq.com/q/PstEbMNSCq" target="_blank" class="button-qq">
                    <span class="btn-icon">💬</span>
                    <div class="btn-content">
                        <div class="btn-title">
                            QQ群
                        </div>
                        <div class="btn-subtitle">
                            点击加入聊天群
                        </div>
                    </div>
                </a>
            </div>

            <div class="info-links">
                <a href="Destiny_CN.zip" download class="button-download">
                    <span class="btn-icon">📦</span>
                    <div class="btn-content">
                        <div class="btn-title">汉化包下载</div>
                        <div class="btn-subtitle">解压到游戏目录即可</div>
                    </div>
                </a>
            </div>
        </div>

        <div class="top-info-col center-col">
            <div class="info-title" id="event-title">游戏活动</div>
            <div class="info-text" id="event-desc">暂无活动</div>
        </div>

        <div class="top-info-col right-col">
            <div class="info-title">Happy Hour</div>
            <div id="hh-next">计算中...</div>
            <div id="hh-countdown">--</div>
        </div>
    </div>

    <div class="control-bar">

        <div class="control-bar-inner">

            <div class="selector-row">

                <span class="selector-label">
                    难度
                </span>

                <button class="tab-btn active">普通</button>
                <button class="tab-btn">困难</button>
                <button class="tab-btn">极难</button>
                <button class="tab-btn">极限</button>

            </div>

            <div class="selector-row">

                <span class="selector-label">
                    章节
                </span>

                <button class="ep-btn active">
                    EP1
                </button>

                <button class="ep-btn">
                    EP2
                </button>

                <button class="ep-btn">
                    EP4
                </button>

            </div>

        </div>

    </div>

    <div class="search-bar">
        <input id="searchInput" class="search-input" placeholder="搜索物品 / 相关物品..." oninput="performSearch()">
    </div>

    <div id="content"></div>
    <div id="bazaar-info"></div>
    <div id="tooltip" class="tooltip"></div>

    <script src="droptable-info.js"></script>
    <script type="module" src="bazaar-info.js"></script>

</body>

</html>

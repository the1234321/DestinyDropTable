<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D服中文资料站</title>
    <link rel="stylesheet" href="assets/css/site.css?v=20261101-3">
    <link rel="stylesheet" href="assets/css/drop-table.css?v=20261031-11">
    <link rel="stylesheet" href="assets/css/bazaar.css?v=20261102-3">
</head>

<body>

    <nav class="wiki-site-nav" aria-label="资料栏目">
        <span class="wiki-brand" data-i18n="brand">命运服中文资料站</span>
        <div class="wiki-nav-dropdown" data-nav-group="drops">
            <button class="wiki-nav-button" type="button" aria-haspopup="true" aria-expanded="false" aria-selected="true" data-i18n="nav.drops">掉落表</button>
            <div class="wiki-nav-dropdown__menu" role="menu">
                <div class="wiki-nav-dropdown__heading" role="presentation" data-i18n="drops.menuHeading">掉落表分类</div>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-drop-view="drops" data-i18n="drops.normal">普通掉落</button>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-drop-view="special" data-i18n="nav.special">特殊掉落</button>
            </div>
        </div>
        <div class="wiki-nav-dropdown">
            <button class="wiki-nav-button wiki-nav-button--featured" type="button" aria-haspopup="true" aria-expanded="false" data-i18n="nav.commands">新手指引</button>
            <div class="wiki-nav-dropdown__menu" role="menu">
                <div class="wiki-nav-dropdown__heading" role="presentation" data-i18n="guide.menuHeading">新手指引栏目</div>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-guide-view="server-rules" data-i18n="guide.serverRules">服务器规则</button>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-guide-view="common-commands" data-i18n="guide.commonCommands">常用命令</button>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-guide-view="level-200" data-i18n="guide.level200">200级配点</button>
            </div>
        </div>
        <div class="wiki-nav-dropdown" data-nav-group="locale-tools" data-non-en>
            <button class="wiki-nav-button" type="button" aria-haspopup="true" aria-expanded="false" aria-selected="false" data-i18n="nav.localeTools">汉化/对照</button>
            <div class="wiki-nav-dropdown__menu" role="menu">
                <div class="wiki-nav-dropdown__heading" role="presentation" data-i18n="localeTools.menuHeading">汉化与对照</div>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-locale-view="localization" data-i18n="guide.localization">汉化指南</button>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-locale-view="dictionary" data-i18n="nav.dictionary">中英对照</button>
            </div>
        </div>
        <div class="wiki-nav-dropdown" data-nav-group="equipment">
            <button class="wiki-nav-button" type="button" aria-haspopup="true" aria-expanded="false" data-default-view="database" data-i18n="nav.crafting">装备相关</button>
            <div class="wiki-nav-dropdown__menu" role="menu">
                <div class="wiki-nav-dropdown__heading" role="presentation" data-i18n="crafting.menuHeading">装备相关分类</div>
                <button class="wiki-nav-dropdown__item wiki-nav-dropdown__item--featured" type="button" role="menuitem" data-equipment-view="database" data-i18n="nav.database">装备速查</button>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-equipment-view="crafting-recipes" data-i18n="crafting.recipes">装备合成</button>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-equipment-view="exchange" data-i18n="crafting.exchange">装备兑换</button>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-equipment-view="crafting-sets" data-i18n="crafting.sets">套装效果</button>
            </div>
        </div>
        <div class="wiki-nav-dropdown" data-nav-group="quests">
            <button class="wiki-nav-button" type="button" aria-haspopup="true" aria-expanded="false" aria-selected="false" data-default-view="quests" data-i18n="nav.quests">任务相关</button>
            <div class="wiki-nav-dropdown__menu" role="menu">
                <button class="wiki-nav-dropdown__item wiki-nav-dropdown__item--featured" type="button" role="menuitem" data-task-view="quests" data-i18n="quests.quickLookup">任务速查</button>
                <button class="wiki-nav-dropdown__item" type="button" role="menuitem" data-task-view="bazaar" data-i18n="nav.bazaar">集市服务</button>
            </div>
        </div>
    <div class="language-switcher" role="group" aria-label="语言选择">
            <button type="button" data-language="cn" aria-pressed="true">中文</button>
            <button type="button" data-language="en" aria-pressed="false">English</button>
    </div>
    </nav>

    <main>
    <section id="drop-table-panel" class="wiki-panel">
    <div class="control-bar difficulty-selector-bar">

        <div class="control-bar-inner">

            <div class="selector-row">

                <span class="selector-label" data-i18n="difficulty">
                    
                </span>

                <button class="tab-btn active" data-difficulty="Normal" data-i18n="difficulty.Normal">普通</button>
                <button class="tab-btn" data-difficulty="Hard" data-i18n="difficulty.Hard">困难</button>
                <button class="tab-btn" data-difficulty="Very Hard" data-i18n="difficulty.Very Hard">极难</button>
                <button class="tab-btn" data-difficulty="Ultimate" data-i18n="difficulty.Ultimate">极限</button>

            </div>

        </div>

    </div>

    <div class="selector-row episode-selector-row">

                <span class="selector-label" data-i18n="episode">
                    
                </span>

                <button class="ep-btn active">
                    EP1
                </button>

                <button class="ep-btn">
                    EP2
                </button>

                <button class="ep-btn">
                    EP4
                </button>

            </div>

    <div class="search-bar">
        <input id="searchInput" class="search-input" data-i18n-placeholder="search" placeholder="搜索物品 / 相关物品...">
    </div>

    <div id="content"></div>
    </section>
    <section id="bazaar-panel" class="wiki-panel" hidden>
        <div id="bazaar-info"></div>
    </section>
    <section id="guide-panel" class="wiki-panel" hidden>
        <article class="command-panel">
            <div id="guide-content" aria-live="polite"></div>
        </article>
    </section>
    <section id="dictionary-panel" class="wiki-panel" hidden>
        <div id="bilingual-dictionary"></div>
    </section>
    <section id="database-panel" class="wiki-panel" hidden>
        <div id="equipment-database"></div>
    </section>
    </main>
    <div id="tooltip" class="tooltip"></div>
    <div id="monster-quest-tooltip" class="monster-quest-tooltip"></div>

    <script src="assets/js/i18n.js?v=20261102-1"></script>
    <script src="assets/js/drop-table.js?v=20261102-1"></script>
    <script type="module" src="assets/js/bazaar.js?v=20261102-3"></script>
    <script src="assets/js/wiki-navigation.js?v=20261101-8"></script>

</body>

</html>

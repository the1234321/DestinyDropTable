<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D服中文资料站</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="assets/css/drop-table.css">
    <link rel="stylesheet" href="assets/css/bazaar.css?v=20260826-4">
</head>

<body>

    <nav class="wiki-site-nav" aria-label="资料栏目">
        <span class="wiki-brand" data-i18n="brand">命运服中文资料站</span>
        <button class="wiki-nav-button is-active" type="button" data-view="drops" aria-selected="true" data-i18n="nav.drops">掉落表</button>
        <button class="wiki-nav-button wiki-nav-button--featured" type="button" data-view="commands" aria-selected="false" data-i18n="nav.commands">新手指引</button>
        <button class="wiki-nav-button" type="button" data-view="dictionary" aria-selected="false" data-i18n="nav.dictionary">中英对照</button>
        <button class="wiki-nav-button" type="button" data-view="special" aria-selected="false" data-i18n="nav.special">特殊掉落</button>
        <button class="wiki-nav-button" type="button" data-view="bazaar" aria-selected="false" data-i18n="nav.bazaar">集市服务与兑换</button>
        <button class="wiki-nav-button" type="button" data-view="effects" aria-selected="false" data-i18n="nav.effects">后期装备</button>
        <button class="wiki-nav-button" type="button" data-view="quests" aria-selected="false" data-i18n="nav.quests">任务介绍</button>
        <button class="wiki-nav-button" type="button" data-view="database" aria-selected="false" data-i18n="nav.database">装备数据库</button>
    <div class="language-switcher" role="group" aria-label="语言选择">
            <button type="button" data-language="cn" aria-pressed="true">中文</button>
            <button type="button" data-language="en" aria-pressed="false">English</button>
    </div>
    </nav>

    <main>
    <section id="drop-table-panel" class="wiki-panel">
    <div class="control-bar difficulty-selector-bar">

        <div class="control-bar-inner">

            <div class="selector-row">

                <span class="selector-label" data-i18n="difficulty">
                    
                </span>

                <button class="tab-btn active" data-difficulty="Normal" data-i18n="difficulty.Normal">普通</button>
                <button class="tab-btn" data-difficulty="Hard" data-i18n="difficulty.Hard">困难</button>
                <button class="tab-btn" data-difficulty="Very Hard" data-i18n="difficulty.Very Hard">极难</button>
                <button class="tab-btn" data-difficulty="Ultimate" data-i18n="difficulty.Ultimate">极限</button>

            </div>

        </div>

    </div>

    <div class="selector-row episode-selector-row">

                <span class="selector-label" data-i18n="episode">
                    
                </span>

                <button class="ep-btn active">
                    EP1
                </button>

                <button class="ep-btn">
                    EP2
                </button>

                <button class="ep-btn">
                    EP4
                </button>

            </div>

    <div class="search-bar">
        <input id="searchInput" class="search-input" data-i18n-placeholder="search" placeholder="搜索物品 / 相关物品..." oninput="performSearch()">
    </div>

    <div id="content"></div>
    </section>
    <section id="bazaar-panel" class="wiki-panel" hidden>
        <div id="bazaar-info"></div>
    </section>
    <section id="commands-panel" class="wiki-panel" hidden>
        <article class="command-panel">
            <p class="command-panel__eyebrow">D服资料</p>
            <h2 data-i18n="nav.commands">新手指引</h2>
            <section class="guide-section">
                <h3 id="event-title">常用命令和规则</h3>
                <div id="event-desc" class="command-panel__content">正在加载…</div>
            </section>
            <section id="localization-guide" class="guide-section"></section>
        </article>
    </section>
    <section id="localization-panel" class="wiki-panel" hidden>
        <div id="localization-guide"></div>
    </section>
    <section id="dictionary-panel" class="wiki-panel" hidden>
        <div id="bilingual-dictionary"></div>
    </section>
    <section id="database-panel" class="wiki-panel" hidden>
        <div id="equipment-database"></div>
    </section>
    </main>
    <div id="tooltip" class="tooltip"></div>

    <script src="assets/js/i18n.js?v=20260905-5"></script>
    <script src="assets/js/drop-table.js?v=20260905-6"></script>
    <script type="module" src="assets/js/bazaar.js?v=20260904-9"></script>
    <script src="assets/js/wiki-navigation.js?v=20260905-5"></script>

</body>

</html>

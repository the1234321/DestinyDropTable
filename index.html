<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D服中文资料站</title>
<style>
:root{--viridia:#1f8f6a; --greenill:#009c63; --skyly:#0084d1; --bluefull:#0069c9; --purplenum:#7f1d7a; --pinkal:#c2185b; --redria:#a32121; --oran:#c05a00; --yellowboze:#9b8700; --whitill:#4b5563;}
* { box-sizing: border-box; }
body { margin:0; font-family: "Segoe UI", Arial, sans-serif; background:#0f172a; color:white; }
.header{
    text-align:center; font-size:28px; font-weight:bold; padding:20px; }
    
.control-bar {
    position: sticky;
    top: 0;
    z-index: 2000;
    backdrop-filter: blur(8px); /* 毛玻璃效果 */
    background: rgba(17, 24, 39, 0.95); /* 深色半透明背景 */
    border-bottom: 1px solid var(--border);
    padding: 8px 0;
}

/* 内部容器居中 */
.control-bar-inner {
    max-width: 1400px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

/* 每行按钮 */
.selector-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative; /* 为遮罩提供上下文 */
}

/* 标签 */
.selector-label {
    width: 60px;
    text-align: right;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
}

/* 按钮放大 */
.tab-btn, .ep-btn {
    min-width: 90px;
    height: 52px;
    font-size: 20px;
    font-weight: 700;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background-color: #1f2937;
    color: #fff;
    transition: all 0.2s;
}

.tab-btn.active, .ep-btn.active {
    background-color: #2563eb;
}

/* 鼠标悬停 */
.tab-btn:hover, .ep-btn:hover {
    background-color: #3b82f6;
}



.search-bar{ padding:15px; text-align:center; }
.search-input{  max-width:90%; border:none; 
    width:50%;

    height:60px;

    font-size:20px;

    padding:0 20px;

    border-radius:12px;}
.table-section{ margin-top:10px;margin-bottom:16px; }
.table-title{ text-align:center; font-size:30px; margin-bottom:10px; position:sticky; top:0; background:#0f172a; z-index:20; }
.table-wrapper{overflow:auto;display:flex;justify-content:center;}
table{ border-collapse:collapse; width:max-content; min-width:1200px; table-layout:fixed;font-size:14px;}

/* 基础单元格 */
th, td{
    border: 1px solid #334155;
    padding: 12px 6px;
    font-size: 12px;
    text-align: center;
    line-height: 1.4;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: normal;    /* 自动换行 */
    word-wrap: break-word;  /* 长词自动换行 */
    overflow-wrap: break-word;
}

/* 表头 sticky */
thead th{
    position: sticky;
    top: 0;
    background: #111827;
    z-index: 20; /* 高于普通单元格 */
}

/* 第一列 sticky (怪物列) */
thead th:first-child,
tbody td:first-child{
    position: sticky;
    left: 0;
    min-width: 140px;
    max-width: 140px;
    width: 140px;
    background: #111827; /* 固定列背景 */
    z-index: 30; /* 高于表头和普通单元格 */
    box-shadow:  10px 0 10px rgba(0,0,0,.35);
    clip-path: inset(0);
}


/* 除第一列外的表格列 */
thead th:not(:first-child),
tbody td:not(:first-child){
    width: 130px;
    min-width: 130px;
    max-width: 130px;
}

/* 基础：除第一列外的hover行 */
tbody tr:hover td:not(:first-child){
    background: rgba(250,204,21,0.15);
}

/* 第一列 hover 高亮 */
tbody tr:hover td:first-child{
    background:#3d3520;
}
tbody td:hover{
    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.2);
}

.item-cell:hover{

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.25);
    position:relative;
}


.item-name{ 
    display:block;
    line-height:1.2;
    font-size:18px; /* 掉落物品字体加大 */
    font-weight:500;
}

.legend-item{

    color:#fbbf24;

    font-weight:700;

    text-shadow:
        0 0 4px rgba(251,191,36,.35);
}

.ultimate-item{
 font-weight:700; background: linear-gradient( 90deg, #ff0000, #ffff00, #00ff00,  #00ffff, #0066ff, #ff00ff);background-size:300%; background-clip:text;-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:rainbow 4s linear infinite;
}


@keyframes ultimateGlow{

    0%{
        background-position:0% 50%;
    }

    100%{
        background-position:300% 50%;
    }
}

.drop-rate{ display:block; margin-top:1px;  color:#94a3b8;
    font-size:20px; /* 掉率字体稍大 */
    color:#94a3b8;
}
.monster-name{ 
    /* font-weight:bold;      */
    font-weight:700;
    font-size:20px; /* 怪物名稍大 */
}
.dar{ color:#facc15; font-size:20px; }
.highlight{

    position:relative;

    z-index:5;

    border-radius:6px;

    animation:searchPulse 1.5s infinite;

    box-shadow:
        0 0 8px rgba(255,255,0,.7),
        0 0 16px rgba(255,255,0,.5),
        inset 0 0 0 2px #ffd700;
}

@keyframes searchPulse{

    0%{
        box-shadow:
            0 0 8px rgba(255,255,0,.5),
            0 0 16px rgba(255,255,0,.3),
            inset 0 0 0 2px #ffd700;
    }

    50%{
        box-shadow:
            0 0 16px rgba(255,255,0,.9),
            0 0 32px rgba(255,255,0,.7),
            inset 0 0 0 3px #fff176;
    }

    100%{
        box-shadow:
            0 0 8px rgba(255,255,0,.5),
            0 0 16px rgba(255,255,0,.3),
            inset 0 0 0 2px #ffd700;
    }
}

.tooltip-farm {
    color: #94b938;       /* 蓝色示例，也可以换成你喜欢的 */
    font-weight: 600;     /* 稍微加粗 */
    font-style: italic;   /* 斜体，看起来更提示信息 */
    margin-top: 2px;      /* 上下间距微调 */
    display: block;
    white-space: normal;  /* 自动换行 */
}

@keyframes rainbow{
    0%{ background-position:0%; }
    100%{ background-position:300%; }
}
.tooltip-item-image{
    display:block;
    max-width:200px;
    max-height:200px;
    width:auto;
    height:auto;
    margin:0 auto 8px auto;
    border-radius:6px;

}

/* Tooltip 内不同字段颜色 */
#tooltip {
    position: fixed;
    z-index: 9999;
    background: rgba(17, 24, 39, 0.95);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.4;
    max-width: 600px;       /* 最大宽度，可根据需要调整 */
    white-space: normal;    /* 自动换行 */
    word-wrap: break-word;  /* 长词自动换行 */
    overflow-wrap: break-word;
    display: none;
}
#tooltip div {
    margin: 2px 0;
}
.tooltip-farm {
    color: #1e90ff;
    font-weight: 600;
    font-style: italic;
}
.tooltip-type{ color:#34d399; margin-top:4px; }
.tooltip-desc{ color:#d1d5db; margin-top:2px; white-space: pre-wrap;  }
.tooltip-quest{ color:#facc15; margin-top:2px; white-space: pre-wrap;   }
.tooltip-id{color:#e52020f9;font-weight:700;margin-top:4px;}
.tooltip-en{color:#94a3b8;font-style:italic;margin-bottom:4px;}

<body>

<div class="header">梦幻之星 命运服 中文资料站</div>

<div class="top-info-row">
  <div class="top-info-col left-col">
    <div class="info-title">Destiny CN</div>
    <div class="info-text">QQ群：432704374</div>

      <a href="Destiny_CN.zip" download>汉化包下载</a>
    </div>
    <div class="info-note">解压到游戏目录即可</div>
  </div>

  <div class="top-info-col center-col">
    <div class="info-title" id="event-title">游戏活动</div>
    <div class="info-text" id="event-desc">暂无活动</div>

  </div>
</div>

<div class="control-bar">

    <div class="control-bar-inner">

        <div class="selector-row">

            <span class="selector-label">
                难度
            </span>

            <button class="tab-btn active">普通</button>
            <button class="tab-btn">困难</button>
            <button class="tab-btn">极难</button>
            <button class="tab-btn">极限</button>

        </div>

        <div class="selector-row">

            <span class="selector-label">
                章节
            </span>

            <button class="ep-btn active">
                EP1
            </button>

            <button class="ep-btn">
                EP2
            </button>

            <button class="ep-btn">
                EP4
            </button>

        </div>

    </div>

</div>

<div class="search-bar">
  <input id="searchInput" class="search-input" placeholder="搜索物品 / 怪物..." oninput="performSearch()">
</div>

<div id="content"></div>
<div id="tooltip" class="tooltip"></div>

<script>
let data;
let currentDifficulty = "极限";
let currentEpisode = "EP1";
let sectionIds = [];

const SECTION_INDEX = {
    Viridia:0, Greenill:1, Skyly:2, Bluefull:3,
    Purplenum:4, Pinkal:5, Redria:6, Oran:7,
    Yellowboze:8, Whitill:9
};

async function loadData(){
    const res = await fetch('data.json?t=' + Date.now());
    data = await res.json();
    sectionIds = data.sectionIds || [];

    //更新活动
    const activities = data.activities;
    document.getElementById("event-title").innerText = activities.event || "无活动";
    document.getElementById("event-desc").innerHTML = (activities.eventDescription || [])
.map(x => `• ${x}`)
.join("<br>");

    // hash同步
    const hash = location.hash;
    if(hash){
window.addEventListener("load", ()=>{
    // hash 解析
    const hash = location.hash.replace("#","");
    if(hash){
        const parts = hash.split("_");
        if(parts.length === 2){
            currentDifficulty = parts[0];
            currentEpisode = parts[1];
        }
         }

            // 默认按钮高亮
            document.querySelectorAll(".tab-btn").forEach(btn=>{
                btn.classList.toggle("active", btn.innerText.trim()===currentDifficulty);
            });
            document.querySelectorAll(".ep-btn").forEach(btn=>{
                btn.classList.toggle("active", btn.innerText.trim()===currentEpisode);
            });

            // 滚动到当前章节
            const el = document.getElementById(currentEpisode);
            if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
        });
    }

    render();
}
function render(){
    const container = document.getElementById("content");
    container.innerHTML = "";

    // 更新顶部按钮active
    document.querySelectorAll(".tab-btn").forEach(btn=>{
        btn.classList.toggle("active", btn.innerText === currentDifficulty);
    });
    document.querySelectorAll(".ep-btn").forEach(btn=>{
        btn.classList.toggle("active", btn.innerText === currentEpisode);
    });

    ["EP1","EP2","EP4"].forEach(ep=>{
        const epData = data.tables?.[currentDifficulty]?.[ep];
        if(!epData) return;

        const section = document.createElement("div");
        section.className = "table-section";
        section.id = ep;

        let html = `
            <div class="table-title">${currentDifficulty} ${ep}</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>  </th>
        `;

        sectionIds.forEach(id=>{
            html += `<th class="header-${id.id}">${id.id}</th>`;
        });

        html += `</tr></thead><tbody>`;

        epData.monsters.forEach(monster=>{
            html += `<tr>
                        <td>
                            <div class="monster-name">${monster.name}</div>
                            <div class="dar">DAR ${monster.dar}</div>
                        </td>
            `;
            sectionIds.forEach(sectionId=>{
                const drop = monster.drops[sectionId.id];
                if(drop){
                    const itemInfo = data.items[drop.item];
                    // console.log('Debug monster:', monster);
                    // console.log('Debug drop:', drop);
                    const rarity = itemInfo.superitem || 0;
                    const rarityClass=rarity===2? "ultimate-item": rarity===1? "legend-item": "";

                html += `
                <td class="item-cell col-${sectionId.id}"
                    data-item="${drop.item}"
                    data-section="${sectionId.id}"
                    data-farm="${monster.farm || ''}">

                    <span class="item-name ${rarityClass}">
                        ${drop.item}
                    </span>

                    <small class="drop-rate">
                        ${drop.rate}
                    </small>

                </td>`;
                }else{
                    html += `<td>-</td>`;
                }
            });
            html += `</tr>`;
        });

        html += `</tbody></table></div>`;
        section.innerHTML = html;
        container.appendChild(section);
    });

    bindTooltips();
    performSearch();
    location.hash = currentDifficulty + "_" + currentEpisode;
}

function jumpTo(ep){
    currentEpisode = ep;

    const el = document.getElementById(ep);
    if(el){
        // 获取固定导航高度
        const nav = document.querySelector(".control-bar");
        const navHeight = nav ? nav.offsetHeight : 0;

        // 页面滚动到元素顶部减去导航高度
        const topPos = el.getBoundingClientRect().top + window.scrollY - navHeight - 5; // 5px 可微调

        window.scrollTo({
            top: topPos,
            behavior: "smooth"
        });

        // 更新 URL hash
        location.hash = currentDifficulty + "_" + ep;

        // 更新按钮高亮
        document.querySelectorAll(".ep-btn").forEach(btn=>{
            btn.classList.toggle("active", btn.innerText.trim() === ep);
        });
        document.querySelectorAll(".tab-btn").forEach(btn=>{
            btn.classList.toggle("active", btn.innerText.trim() === currentDifficulty);
        });
    }
}

function switchDifficulty(diff){
    currentDifficulty = diff;

    // 更新按钮高亮
    document.querySelectorAll(".tab-btn").forEach(btn=>{
        btn.classList.toggle("active", btn.innerText.trim() === diff);
    });

    // URL hash 保持同步
    location.hash = currentDifficulty + "_" + currentEpisode;

    // 如果你想切换难度时自动滚到当前EP
    const el = document.getElementById(currentEpisode);
    if(el){
        el.scrollIntoView({behavior:"smooth", block:"start"});
    }
    render()
}

function bindTooltips(){
    document.querySelectorAll(".item-cell").forEach(cell=>{
        cell.addEventListener("mousemove", e=>{
            const itemName = cell.dataset.item;
            const section = cell.dataset.section;
            const sectionNumber = SECTION_INDEX[section];
            const item = data.items[itemName];
            const farm = cell.dataset.farm || "";
            if(!item) return;
            const tooltip = document.getElementById("tooltip");
            const rarity = item.superitem || 0;
            const rarityClass = rarity === 2 ? 'ultimate-item' : rarity === 1  ? 'legend-item'   : '';

            tooltip.innerHTML = `
                ${item.image && item.image.trim() !== "" ? `<img src="images/${item.image}" class="tooltip-item-image">` : ""}
                <div class="tooltip-name ${rarityClass}"> ${itemName}</div>
                ${item.english?`<div class="tooltip-en">${item.english}</div>`:""}
                <div class="tooltip-id">sectionid ${sectionNumber}</div>
                <div class="tooltip-type">类型：${item.type||"-"}</div>
                <div class="tooltip-desc">${item.description||""}</div>
                ${item.quest?`<div class="tooltip-quest">额外说明：${item.quest}</div>`:""}
                ${farm?`<div class="tooltip-farm">刷怪建议：${farm}</div>`:""}
            `;
            tooltip.style.display = "block";

            const offset = 15;
            let left = e.clientX + offset;
            let top = e.clientY + offset;

            if(left + tooltip.offsetWidth > window.innerWidth){
                left = e.clientX - tooltip.offsetWidth - offset;
            }
            if(top + tooltip.offsetHeight > window.innerHeight){
                top = e.clientY - tooltip.offsetHeight - offset;
            }

            tooltip.style.left = left + "px";
            tooltip.style.top = top + "px";
        });

        cell.addEventListener("mouseleave", ()=>{
            document.getElementById("tooltip").style.display = "none";
        });
        
    });
}

function performSearch(){
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    if(!data) return;
    let firstMatch = null;

    document.querySelectorAll("tbody tr").forEach(row=>{
        row.style.display = "";
        row.querySelectorAll("td").forEach(td=>td.classList.remove("highlight"));
        if(!keyword) return;

        let rowMatched = false;
        row.querySelectorAll("td").forEach(td=>{
            let matched = false;
            const cellText = td.innerText.toLowerCase();
            if(cellText.includes(keyword)) matched = true;

            const itemName = td.dataset.item;
            if(itemName && data.items[itemName]){
                const item = data.items[itemName];
                if(
                    (item.english||"").toLowerCase().includes(keyword) ||
                    (item.type||"").toLowerCase().includes(keyword) ||
                    (item.description||"").toLowerCase().includes(keyword) ||
                    (item.quest||"").toLowerCase().includes(keyword)
                ) matched = true;
            }
            if(matched){
                td.classList.add("highlight");
                rowMatched = true;
                if(!firstMatch) firstMatch = row;
            }
        });
        if(!rowMatched && keyword!=="") row.style.display = "none";
    });

    document.querySelectorAll(".table-section").forEach(section=>{
        if(!keyword){ section.style.display=""; return; }
        const visibleRows = section.querySelectorAll('tbody tr:not([style*="display: none"])').length;
        section.style.display = visibleRows>0 ? "" : "none";
    });

    if(firstMatch) firstMatch.scrollIntoView({behavior:"smooth", block:"center"});
}

function bindControlButtons(){
document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick = ()=>switchDifficulty(btn.innerText.trim());
});
document.querySelectorAll(".ep-btn").forEach(btn=>{
    btn.onclick = ()=>jumpTo(btn.innerText.trim());
});
}

bindControlButtons();

// Happy Hour
const HH_START = new Date("2026-05-30T06:30:00");
const HH_INTERVAL = 15.5 * 60 * 60 * 1000; // 15.5小时轮询
const HH_DURATION = 3 * 60 * 60 * 1000;    // 持续3小时

function updateHappyHour(){
    const now = new Date().getTime();
    let current = HH_START.getTime();

    // 找到最近一次开始时间
    while(current + HH_INTERVAL <= now){
        current += HH_INTERVAL;
    }

    let statusText = "";
    let diff = 0;

    if(now >= current && now < current + HH_DURATION){
        // 进行中
        statusText = "Happy Hour进行中";
        diff = (current + HH_DURATION) - now; // 剩余时间到结束
    } else {
        // 下次开始
        if(now < current){
            diff = current - now;
        } else {
            current += HH_INTERVAL;
            diff = current - now;
        }
        statusText = "下次开始：" + new Date(current).toLocaleString();
    }

    const hours = Math.floor(diff / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);

    document.getElementById("hh-next").innerHTML = statusText;
    document.getElementById("hh-countdown").innerHTML = `${hours}h ${mins}m ${secs}s`;
}

// 初始化
updateHappyHour();
setInterval(updateHappyHour, 1000);

loadData();
</script>

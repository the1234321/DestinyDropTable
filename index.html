<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D服中文资料站</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="assets/css/drop-table.css">
    <link rel="stylesheet" href="assets/css/bazaar.css">
</head>

<body>

    <nav class="wiki-site-nav" aria-label="资料栏目">
        <span class="wiki-brand">命运服中文资料站</span>
        <button class="wiki-nav-button is-active" type="button" data-view="drops" aria-selected="true">掉落表</button>
        <button class="wiki-nav-button wiki-nav-button--featured" type="button" data-view="commands" aria-selected="false">常用命令和规则</button>
        <button class="wiki-nav-button" type="button" data-view="localization" aria-selected="false">汉化指南</button>
        <button class="wiki-nav-button" type="button" data-view="currency" aria-selected="false">货币说明</button>
        <button class="wiki-nav-button" type="button" data-view="special" aria-selected="false">特殊掉落</button>
        <button class="wiki-nav-button" type="button" data-view="tpd" aria-selected="false">TPD速查</button>
        <button class="wiki-nav-button" type="button" data-view="services" aria-selected="false">集市服务</button>
        <button class="wiki-nav-button" type="button" data-view="exchange" aria-selected="false">集市兑换</button>
        <button class="wiki-nav-button" type="button" data-view="effects" aria-selected="false">后期装备</button>
        <button class="wiki-nav-button" type="button" data-view="quests" aria-selected="false">任务介绍</button>
    </nav>

    <main>
    <section id="drop-table-panel" class="wiki-panel">
    <div class="control-bar">

        <div class="control-bar-inner">

            <div class="selector-row">

                <span class="selector-label">
                    难度
                </span>

                <button class="tab-btn active">普通</button>
                <button class="tab-btn">困难</button>
                <button class="tab-btn">极难</button>
                <button class="tab-btn">极限</button>

            </div>

            <div class="selector-row">

                <span class="selector-label">
                    章节
                </span>

                <button class="ep-btn active">
                    EP1
                </button>

                <button class="ep-btn">
                    EP2
                </button>

                <button class="ep-btn">
                    EP4
                </button>

            </div>

        </div>

    </div>

    <div class="search-bar">
        <input id="searchInput" class="search-input" placeholder="搜索物品 / 相关物品..." oninput="performSearch()">
    </div>

    <div id="content"></div>
    </section>
    <section id="bazaar-panel" class="wiki-panel" hidden>
        <div id="bazaar-info"></div>
    </section>
    <section id="commands-panel" class="wiki-panel" hidden>
        <article class="command-panel">
            <p class="command-panel__eyebrow">D服资料</p>
            <h2 id="event-title">常用命令和规则</h2>
            <div id="event-desc" class="command-panel__content">正在加载…</div>
        </article>
    </section>
    <section id="localization-panel" class="wiki-panel" hidden>
        <div id="localization-guide"></div>
    </section>
    </main>
    <div id="tooltip" class="tooltip"></div>

    <script src="assets/js/drop-table.js"></script>
    <script type="module" src="assets/js/bazaar.js"></script>
    <script src="assets/js/wiki-navigation.js"></script>

</body>

</html>

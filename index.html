<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PSOBB Destiny Drop Tables</title>

<style>

body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Segoe UI,Arial,sans-serif;
}

header{
    background:#1a1a1a;
    padding:10px;
    position:sticky;
    top:0;
    z-index:100;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
}

.tab{
    padding:8px 16px;
    background:#2a2a2a;
    cursor:pointer;
    border-radius:4px;
    user-select:none;
}

.tab.active{
    background:#4caf50;
}

.search{
    margin-left:auto;
    padding:8px;
    min-width:250px;
}

button{
    padding:8px 14px;
    cursor:pointer;
}

.version{
    margin-top:8px;
    color:#aaa;
    font-size:13px;
}

.container{
    padding:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

th{
    background:#222;
    color:white;
    position:sticky;
    top:72px;
    z-index:50;
}

th,td{
    border:1px solid #333;
    padding:6px;
    text-align:center;
}

th:nth-child(2),
td:nth-child(2){background:#0b665c;}

th:nth-child(3),
td:nth-child(3){background:#1e5f9c;}

th:nth-child(4),
td:nth-child(4){background:#5b2f9e;}

th:nth-child(5),
td:nth-child(5){background:#8a3b23;}

th:nth-child(6),
td:nth-child(6){background:#85700f;}

.highlight{
    background:yellow !important;
    color:black !important;
    font-weight:bold;
}

.tooltip{
    position:fixed;
    display:none;
    max-width:320px;
    background:#222;
    border:1px solid #666;
    padding:10px;
    border-radius:6px;
    z-index:9999;
    pointer-events:none;
}

</style>
</head>
<body>

<header>

<div class="toolbar" id="difficultyTabs"></div>

<div style="height:10px"></div>

<div class="toolbar" id="episodeTabs">

<input
class="search"
id="searchBox"
placeholder="搜索怪物或物品..."
>

<button onclick="reloadData()">更新数据</button>

</div>

<div class="version" id="version"></div>

</header>

<div class="container">

<table id="dropTable">

<thead>
<tr>

<th>Monster</th>

<th>铭绿</th>
<th>Greenill</th>
<th>Skyly</th>
<th>Bluefull</th>
<th>Purplenum</th>

<th>Pinkal</th>
<th>Redria</th>
<th>Oran</th>
<th>Yellowboze</th>
<th>Whitill</th>

</tr>
</thead>

<tbody></tbody>

</table>

</div>

<div class="tooltip" id="tooltip"></div>

<script>

let DATA=null;

let currentDifficulty='U';
let currentEpisode='EP1';

const difficulties=['N','H','VH','U'];
const episodes=['EP1','EP2','EP4'];

async function loadData(){

    const res=await fetch(
        "data.json?t="+Date.now()
    );

    DATA=await res.json();

    document.getElementById("version")
        .innerText="Version: "+DATA.version;

    buildTabs();

    renderTable();
}

function buildTabs(){

    const d=document.getElementById("difficultyTabs");

    d.innerHTML='';

    difficulties.forEach(diff=>{

        const btn=document.createElement('div');

        btn.className=
            'tab'+
            (diff===currentDifficulty?' active':'');

        btn.innerText=diff;

        btn.onclick=()=>{

            currentDifficulty=diff;

            buildTabs();
            renderTable();

        };

        d.appendChild(btn);

    });

    const e=document.getElementById("episodeTabs");

    episodes.forEach(ep=>{

        let btn=document.getElementById("ep_"+ep);

        if(btn) return;

        btn=document.createElement('div');

        btn.id='ep_'+ep;

        btn.className='tab';

        btn.innerText=ep;

        btn.onclick=()=>{

            currentEpisode=ep;

            document
            .querySelectorAll('#episodeTabs .tab')
            .forEach(x=>x.classList.remove('active'));

            btn.classList.add('active');

            renderTable();

        };

        e.insertBefore(btn,e.firstChild);

    });

    document
    .querySelector('#ep_'+currentEpisode)
    ?.classList.add('active');

}

function renderTable(){

    const tbody=
    document.querySelector('#dropTable tbody');

    tbody.innerHTML='';

    const keyword=
    document.getElementById('searchBox')
    .value
    .toLowerCase();

    const rows=
    DATA.drops.filter(x=>

        x.difficulty===currentDifficulty
        &&
        x.episode===currentEpisode

    );

    rows.forEach(row=>{

        let found=false;

        Object.values(row)
        .forEach(v=>{

            if(
                String(v)
                .toLowerCase()
                .includes(keyword)
            )
            found=true;

        });

        if(keyword && !found)
            return;

        const tr=document.createElement('tr');

        const cols=[

            'monster',

            'Viridia',
            'Greenill',
            'Skyly',
            'Bluefull',
            'Purplenum',

            'Pinkal',
            'Redria',
            'Oran',
            'Yellowboze',
            'Whitill'

        ];

        cols.forEach(col=>{

            const td=document.createElement('td');

            const value=row[col] || '';

            if(
                keyword &&
                value.toLowerCase()
                .includes(keyword)
            ){

                td.innerHTML=
                value.replace(
                    new RegExp(
                        keyword,
                        'ig'
                    ),
                    m=>
                    '<span class="highlight">'
                    +m+
                    '</span>'
                );

            }
            else{

                td.textContent=value;

            }

            if(DATA.items[value]){

                td.addEventListener(
                    'mousemove',
                    ev=>showTooltip(
                        ev,
                        value
                    )
                );

                td.addEventListener(
                    'mouseleave',
                    hideTooltip
                );

            }

            tr.appendChild(td);

        });

        tbody.appendChild(tr);

    });

}

function showTooltip(ev,item){

    const data=
    DATA.items[item];

    if(!data)
        return;

    const t=
    document.getElementById(
        'tooltip'
    );

    t.innerHTML=`
        <b>${item}</b><br><br>
        类型：${data.type||''}<br>
        稀有度：${data.rarity||''}<br><br>
        ${data.description||''}
    `;

    t.style.display='block';

    t.style.left=
        (ev.clientX+15)+'px';

    t.style.top=
        (ev.clientY+15)+'px';
}

function hideTooltip(){

    document
    .getElementById('tooltip')
    .style.display='none';

}

document
.getElementById('searchBox')
.addEventListener(
    'input',
    renderTable
);

async function reloadData(){

    await loadData();

    alert(
        '已从GitHub获取最新数据'
    );
}

loadData();

</script>

</body>
</html>

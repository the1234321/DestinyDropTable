<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drop Tables</title>
<style>
:root{
    --viridia:#1f8f6a;
    --greenill:#009c63;
    --skyly:#0084d1;
    --bluefull:#0069c9;
    --purplenum:#7f1d7a;
    --pinkal:#c2185b;
    --redria:#a32121;
    --oran:#c05a00;
    --yellowboze:#9b8700;
    --whitill:#4b5563;
}
* { box-sizing: border-box; }
body { margin:0; font-family: "Segoe UI", Arial, sans-serif; background:#0f172a; color:white; }
.header{
     text-align:center; font-size:28px; font-weight:bold; padding:20px; }
.difficulty-tabs{ display:flex; justify-content:center; gap:10px; padding:10px; position:sticky; top:0; background:#111827; z-index:100; }
.tab-btn{ padding:10px 20px; border:none; border-radius:8px; cursor:pointer; background:#1f2937; color:white; }
.tab-btn.active{ background:#2563eb; }
.search-bar{ padding:15px; text-align:center; }
.search-input{ width:400px; max-width:90%; padding:10px; border-radius:8px; border:none; }
.ep-nav{ display:flex; position:sticky; justify-content:center; gap:10px; margin-bottom:15px; }
.ep-nav button{ padding:8px 16px; border:none; border-radius:6px; cursor:pointer; }
.table-section{ margin-top:10px;margin-bottom:16px; }
.table-title{ text-align:center; font-size:24px; margin-bottom:10px; position:sticky; top:0; background:#0f172a; z-index:20; }
.table-wrapper{overflow:auto;display:flex;justify-content:center;}
table{ border-collapse:collapse; width:max-content; min-width:1200px; table-layout:fixed;}
th, td{ border:1px solid #334155; padding:6px; font-size:12px; text-align:center; }
thead th{ position:sticky; top:0; background:#111827; z-index:10; }
tbody td:first-child, thead th:first-child{ position:sticky; left:0; background:#111827; z-index:11; width:140px;min-width:140px;max-width:140px;}
thead th:not(:first-child),
tbody td:not(:first-child){width:130px;min-width:130px;max-width:130px;}
.item-name{
    display:block;
    line-height:1.15;
}

.drop-rate{
    display:block;
    margin-top:1px;
    font-size:10px;
    color:#94a3b8;
}
.monster-name{ font-weight:bold; }
.dar{ color:#facc15; font-size:10px; }
.highlight{ outline:3px solid yellow; }
.tooltip{ position:fixed; display:none; background:#111827; border:1px solid #475569; padding:10px; border-radius:8px; z-index:9999; max-width:300px; pointer-events:none; }
/* superitem */
.super-item{
    font-weight:700;
    background: linear-gradient(
        90deg,
        #ff0000,
        #ffff00,
        #00ff00,
        #00ffff,
        #0066ff,
        #ff00ff
    );
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:rainbow 4s linear infinite;
}

@keyframes rainbow{
    0%{ background-position:0%; }
    100%{ background-position:300%; }
}

/* Tooltip 内不同字段颜色 */
.tooltip-name{ color:#60a5fa; font-weight:700; font-size:16px; }
.tooltip-name.super{ /* superitem 彩虹效果 */ background: linear-gradient(90deg,#ff0000,#ffff00,#00ff00,#00ffff,#0066ff,#ff00ff); background-size:300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:rainbow 4s linear infinite; }
.tooltip-type{ color:#34d399; margin-top:4px; }
.tooltip-desc{ color:#d1d5db; margin-top:2px; }
.tooltip-quest{ color:#facc15; margin-top:2px; }

.header-Viridia{
    background:var(--viridia);
}

.header-Greenill{
    background:var(--greenill);
}

.header-Skyly{
    background:var(--skyly);
}

.header-Bluefull{
    background:var(--bluefull);
}

.header-Purplenum{
    background:var(--purplenum);
}

.header-Pinkal{
    background:var(--pinkal);
}

.header-Redria{
    background:var(--redria);
}

.header-Oran{
    background:var(--oran);
}

.header-Yellowboze{
    background:var(--yellowboze);
}

.header-Whitill{
    background:var(--whitill);
}


.col-Viridia{
    background:rgba(31,143,106,.25);
}

.col-Greenill{
    background:rgba(0,156,99,.25);
}

.col-Skyly{
    background:rgba(0,132,209,.25);
}

.col-Bluefull{
    background:rgba(0,105,201,.25);
}

.col-Purplenum{
    background:rgba(127,29,122,.25);
}

.col-Pinkal{
    background:rgba(194,24,91,.25);
}

.col-Redria{
    background:rgba(163,33,33,.25);
}

.col-Oran{
    background:rgba(192,90,0,.25);
}

.col-Yellowboze{
    background:rgba(155,135,0,.25);
}

.col-Whitill{
    background:rgba(75,85,99,.25);
}

.col-Viridia:hover{
    background:rgba(31,143,106,.45);
}

.col-Greenill:hover{
    background:rgba(0,156,99,.45);
}

.col-Skyly:hover{
    background:rgba(0,132,209,.45);
}

.col-Bluefull:hover{
    background:rgba(0,105,201,.45);
}

.col-Purplenum:hover{
    background:rgba(127,29,122,.45);
}

.col-Pinkal:hover{
    background:rgba(194,24,91,.45);
}

.col-Redria:hover{
    background:rgba(163,33,33,.45);
}

.col-Oran:hover{
    background:rgba(192,90,0,.45);
}

.col-Yellowboze:hover{
    background:rgba(155,135,0,.45);
}

.col-Whitill:hover{
    background:rgba(75,85,99,.45);
}

.item-cell:hover{

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.25);

    z-index:5;

    position:relative;
}

#content{max-width:1800px;margin:auto;padding:0 8px;}
tbody td:hover{
    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.2);
}

</style>
</head>
<body>

<div class="header">DROP TABLES</div>

<div class="difficulty-tabs">
  <button class="tab-btn active" onclick="switchDifficulty('N')">N</button>
  <button class="tab-btn" onclick="switchDifficulty('H')">H</button>
  <button class="tab-btn" onclick="switchDifficulty('VH')">VH</button>
  <button class="tab-btn" onclick="switchDifficulty('U')">U</button>
</div>

<div class="search-bar">
  <input id="searchInput" class="search-input" placeholder="搜索物品 / 怪物..." oninput="performSearch()">
</div>

<div class="ep-nav">
  <button onclick="jumpTo('EP1')">EP1</button>
  <button onclick="jumpTo('EP2')">EP2</button>
  <button onclick="jumpTo('EP4')">EP4</button>
</div>

<div id="content"></div>
<div id="tooltip" class="tooltip"></div>

<script>
let data;
let currentDifficulty = "N";
let sectionIds = [];
async function loadData(){
    const res = await fetch('data.json?t=' + Date.now());
    data = await res.json();
    sectionIds = data.sectionIds;
    const hash = location.hash;
    if(hash){ 
        const m = hash.match(/^#([NHVHU]+)_(EP\d)$/);
        if(m){ currentDifficulty=m[1]; jumpTo(m[2]); }
    }
    render();
}

function switchDifficulty(diff){
    currentDifficulty=diff;
    document.querySelectorAll(".tab-btn").forEach(btn=>btn.classList.remove("active"));
    [...document.querySelectorAll(".tab-btn")].find(x=>x.innerText===diff).classList.add("active");
    render();
}

function jumpTo(ep){
    const el = document.getElementById(ep);
    if(el){
        el.scrollIntoView({behavior:"smooth"});
        location.hash = currentDifficulty + "_" + ep;

        // 刷新 active tab
        document.querySelectorAll(".tab-btn").forEach(btn=>btn.classList.remove("active"));
        [...document.querySelectorAll(".tab-btn")].find(x=>x.innerText===currentDifficulty).classList.add("active");
    }
}

function render() {
    const container = document.getElementById("content");
    container.innerHTML = "";

    const ids = sectionIds; // 全局 sectionId 数组

    ["EP1", "EP2", "EP4"].forEach(ep => {
        const epData = data.tables[currentDifficulty][ep];
        if (!epData) return;

        const section = document.createElement("div");
        section.className = "table-section";
        section.id = ep;

        let html = `
            <div class="table-title">${currentDifficulty} ${ep}</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Monster</th>
        `;

        ids.forEach(id => {
            html += `<th class="header-${id.id}">${id.id}</th>`;
        });

        html += `</tr></thead><tbody>`;

        epData.monsters.forEach(monster => {
            html += `<tr>
                        <td>
                            <div class="monster-name">${monster.name}</div>
                            <div class="dar">DAR ${monster.dar}</div>
                        </td>
            `;

            ids.forEach(sectionId => {
                const drop = monster.drops[sectionId.id];
                if (drop) {
                    const itemInfo = data.items[drop.item];
                    const isSuper = itemInfo?.superitem === true;

                    html += `
                    <td class="item-cell col-${sectionId.id}" data-item="${drop.item}">
                        <span class="item-name ${isSuper ? 'super-item' : ''}">
                            ${drop.item}
                        </span>
                        <small class="drop-rate">
                            ${drop.rate}
                        </small>
                    </td>
                    `;
                } else {
                    html += `<td>-</td>`;
                }
            });

            html += `</tr>`;
        });

        html += `</tbody></table></div>`;
        section.innerHTML = html;
        container.appendChild(section);
    });

    bindTooltips();
    performSearch(); // 搜索后高亮仍生效
}

// Tooltip
function bindTooltips(){
    document.querySelectorAll(".item-cell").forEach(cell=>{
        cell.addEventListener("mousemove", e => {
    const itemName = cell.dataset.item;
    const item = data.items[itemName];
    if(!item) return;

    const isSuper = item.superitem === true;

    const tooltip = document.getElementById("tooltip");
    tooltip.innerHTML = `
        <div class="tooltip-name ${isSuper ? 'super' : ''}">
            ${itemName}
        </div>
        <div class="tooltip-type">类型：${item.type}</div>
        <div class="tooltip-desc">${item.description}</div>
        ${item.quest ? `<div class="tooltip-quest">推荐任务：${item.quest}</div>` : ''}
    `;

    tooltip.style.display = "block";
    tooltip.style.left = (e.clientX+15) + "px";
    tooltip.style.top = (e.clientY+15) + "px";
});
        cell.addEventListener("mouseleave",()=>{document.getElementById("tooltip").style.display="none";});
    });
}

// 搜索
function performSearch(){
    const keyword = document.getElementById("searchInput").value.toLowerCase();
    let firstMatch = null;
    document.querySelectorAll("tbody tr").forEach(row=>{
        row.style.display="none";
        row.querySelectorAll("td").forEach(td=>td.classList.remove("highlight"));
        const text = row.innerText.toLowerCase();
        if(keyword==="" || text.includes(keyword)){
            row.style.display="";
            row.querySelectorAll("td").forEach(td=>{
                if(td.innerText.toLowerCase().includes(keyword) && keyword!==""){
                    td.classList.add("highlight");
                    if(!firstMatch) firstMatch = row;
                }
            });
        }
    });
    if(firstMatch){ 
        firstMatch.scrollIntoView({behavior:"smooth"});
    }
}

loadData();
setInterval(loadData,30000); // 每30秒刷新
</script>

</body>
</html>
